<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloutHub Key</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --gold:#ffd000;
    --gold2:#ffea72;
    --black:#030303;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:#030303;
}

/* ================= BACKGROUND ================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,
        rgba(255,208,0,.12),
        transparent 35%),
        #030303;
}

.orb{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(255,208,0,.08);
    filter:blur(100px);
    animation:orbMove 10s infinite alternate ease-in-out;
}

.orb:nth-child(1){
    left:-250px;
    top:-200px;
}

.orb:nth-child(2){
    right:-250px;
    bottom:-220px;
    animation-delay:3s;
}

@keyframes orbMove{
    0%{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(100px,60px) scale(1.25);
    }
    100%{
        transform:translate(-50px,100px) scale(.9);
    }
}

/* ================= PARTICLES ================= */

.particles span{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 12px var(--gold);
    animation:rise linear infinite;
}

.particles span:nth-child(1){left:5%;animation-duration:8s;}
.particles span:nth-child(2){left:15%;animation-duration:11s;}
.particles span:nth-child(3){left:28%;animation-duration:9s;}
.particles span:nth-child(4){left:42%;animation-duration:13s;}
.particles span:nth-child(5){left:57%;animation-duration:10s;}
.particles span:nth-child(6){left:70%;animation-duration:12s;}
.particles span:nth-child(7){left:83%;animation-duration:9s;}
.particles span:nth-child(8){left:94%;animation-duration:14s;}

@keyframes rise{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{opacity:.9;}
    85%{opacity:.5;}
    to{
        transform:translateY(-20vh);
        opacity:0;
    }
}

/* ================= CARD ================= */

.card{
    position:relative;
    width:min(94%,500px);
    padding:38px 32px 30px;
    border-radius:32px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(25,23,13,.94),
            rgba(7,7,6,.94)
        );

    border:1px solid rgba(255,208,0,.28);

    backdrop-filter:blur(25px);

    box-shadow:
        0 0 40px rgba(255,208,0,.08),
        0 30px 100px rgba(0,0,0,.7);

    animation:cardIn 1s cubic-bezier(.2,.8,.2,1);
}

.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:32px;
    pointer-events:none;

    background:
        linear-gradient(
            120deg,
            transparent 20%,
            rgba(255,208,0,.8),
            transparent 45%,
            rgba(255,208,0,.25),
            transparent 75%
        );

    background-size:250% 250%;
    animation:borderGlow 5s linear infinite;

    mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    mask-composite:exclude;
    padding:1px;
}

@keyframes borderGlow{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(60px) scale(.88);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* ================= BEE LOGO ================= */

.logo-wrap{
    position:relative;
    width:125px;
    height:125px;
    margin:0 auto 24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-ring{
    position:absolute;
    inset:0;
    border:1px solid rgba(255,208,0,.45);
    border-radius:50%;
    box-shadow:
        0 0 25px rgba(255,208,0,.18),
        inset 0 0 25px rgba(255,208,0,.1);
    animation:ringSpin 8s linear infinite;
}

.logo-ring::before,
.logo-ring::after{
    content:"";
    position:absolute;
    width:7px;
    height:7px;
    background:var(--gold);
    border-radius:50%;
    box-shadow:0 0 12px var(--gold);
}

.logo-ring::before{
    top:10px;
    left:25px;
}

.logo-ring::after{
    right:18px;
    bottom:18px;
}

@keyframes ringSpin{
    to{
        transform:rotate(360deg);
    }
}

.bee-logo{
    position:relative;
    width:88px;
    height:88px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #ffe96b,
            #ffc400 50%,
            #a97900
        );

    box-shadow:
        0 0 25px rgba(255,208,0,.55),
        0 0 65px rgba(255,208,0,.2);

    animation:beeFloat 3s ease-in-out infinite;
}

.bee-body{
    position:relative;
    width:53px;
    height:42px;
    border-radius:50%;
    background:#090909;
    transform:rotate(-8deg);
    box-shadow:0 8px 10px rgba(0,0,0,.3);
}

/* yellow bee stripes */

.bee-body::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;

    background:
        linear-gradient(
            90deg,
            transparent 17%,
            var(--gold) 18%,
            var(--gold) 29%,
            transparent 30%,
            transparent 45%,
            var(--gold) 46%,
            var(--gold) 57%,
            transparent 58%,
            transparent 73%,
            var(--gold) 74%,
            var(--gold) 85%,
            transparent 86%
        );
}

/* wings */

.wing{
    position:absolute;
    width:30px;
    height:25px;
    top:-15px;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 0 12px rgba(255,255,255,.2);
}

.wing.left{
    left:2px;
    border-radius:80% 20% 60% 40%;
    transform:rotate(-30deg);
}

.wing.right{
    right:2px;
    border-radius:20% 80% 40% 60%;
    transform:rotate(30deg);
}

/* eyes */

.eye{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 6px white;
    right:3px;
    top:9px;
}

@keyframes beeFloat{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-8px) rotate(3deg);
    }
}

/* ================= TITLE ================= */

.title{
    font-size:clamp(38px,9vw,52px);
    font-weight:1000;
    letter-spacing:-2.5px;
    line-height:1;
    margin-bottom:13px;
    color:white;
    text-shadow:0 0 25px rgba(255,208,0,.12);
}

.title .gold{
    color:var(--gold);
    text-shadow:
        0 0 10px rgba(255,208,0,.7),
        0 0 35px rgba(255,208,0,.25);
}

.subtitle{
    color:#858585;
    font-size:13px;
    margin-bottom:24px;
}

/* ================= STATUS ================= */

.status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    margin-bottom:22px;
    border-radius:100px;

    background:rgba(255,208,0,.05);
    border:1px solid rgba(255,208,0,.16);

    color:#c7c7c7;
    font-size:10px;
    letter-spacing:.7px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#71ff75;
    box-shadow:0 0 12px #71ff75;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(.55);
        opacity:.4;
    }
}

/* ================= KEY BOX ================= */

.key-label{
    text-align:left;
    color:#9a9a9a;
    font-size:11px;
    margin:0 0 8px 3px;
}

.key-box{
    position:relative;
    width:100%;
    padding:18px 55px 18px 18px;
    border-radius:15px;

    background:
        linear-gradient(
            100deg,
            rgba(255,208,0,.08),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,208,0,.28);

    box-shadow:
        inset 0 0 20px rgba(255,208,0,.025),
        0 0 25px rgba(255,208,0,.04);

    overflow:hidden;
}

.key-box::before{
    content:"";
    position:absolute;
    width:100px;
    height:200%;
    top:-50%;
    left:-130px;
    background:rgba(255,255,255,.08);
    transform:rotate(25deg);
    animation:keyShine 4s infinite;
}

@keyframes keyShine{
    0%{left:-130px}
    45%,100%{left:120%}
}

.key-text{
    position:relative;
    z-index:2;
    display:block;
    color:var(--gold2);
    font-size:13px;
    font-weight:800;
    letter-spacing:.2px;
    line-height:1.5;
    word-break:break-all;
    text-shadow:0 0 10px rgba(255,208,0,.3);
}

.copy-icon{
    position:absolute;
    z-index:3;
    right:10px;
    top:50%;
    transform:translateY(-50%);

    width:35px;
    height:35px;

    border:1px solid rgba(255,208,0,.25);
    border-radius:10px;

    background:rgba(255,208,0,.08);
    color:var(--gold);

    cursor:pointer;

    transition:.25s;
}

.copy-icon:hover{
    background:var(--gold);
    color:#000;
    box-shadow:0 0 20px rgba(255,208,0,.35);
    transform:translateY(-50%) scale(1.08);
}

/* ================= COPY BUTTON ================= */

.copy-btn{
    position:relative;
    width:100%;
    margin-top:14px;
    padding:18px;

    border:0;
    border-radius:15px;

    cursor:pointer;

    color:#080808;
    font-size:14px;
    font-weight:1000;
    letter-spacing:1px;

    background:
        linear-gradient(
            100deg,
            #ffb900,
            #ffe96b,
            #ffc400,
            #ffe96b
        );

    background-size:300% 100%;

    box-shadow:
        0 12px 35px rgba(255,208,0,.2);

    transition:.3s;

    animation:gradientMove 4s linear infinite;
}

.copy-btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 18px 45px rgba(255,208,0,.35);
}

.copy-btn:active{
    transform:scale(.96);
}

@keyframes gradientMove{
    0%{background-position:0%}
    100%{background-position:300%}
}

/* ================= MESSAGE ================= */

#message{
    min-height:20px;
    margin-top:15px;
    font-size:12px;
    font-weight:800;
}

.success{
    color:#76ff82;
    text-shadow:0 0 12px rgba(118,255,130,.5);
}

.footer{
    margin-top:25px;
    color:#4d4d4d;
    font-size:9px;
    letter-spacing:.7px;
}

@media(max-width:500px){
    .card{
        padding:30px 21px 25px;
    }

    .logo-wrap{
        width:110px;
        height:110px;
    }

    .bee-logo{
        width:78px;
        height:78px;
    }

    .title{
        font-size:37px;
    }

    .key-text{
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg">

    <div class="orb"></div>
    <div class="orb"></div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>


<!-- CARD -->
<div class="card">

    <!-- BEE -->
    <div class="logo-wrap">

        <div class="logo-ring"></div>

        <div class="bee-logo">

            <div class="bee-body">

                <div class="wing left"></div>
                <div class="wing right"></div>

                <div class="eye"></div>

            </div>

        </div>

    </div>


    <!-- STATUS -->
    <div class="status">
        <span class="status-dot"></span>
        CLOUTHUB KEY SYSTEM ONLINE
    </div>


    <!-- TITLE -->
    <h1 class="title">
        Clout<span class="gold">Hub</span> Key
    </h1>

    <p class="subtitle">
        Your exclusive access key is ready
    </p>


    <!-- KEY -->
    <div class="key-label">
        YOUR KEY
    </div>

    <div class="key-box">

        <span
            id="keyText"
            class="key-text"
        >
            CloutHubKeyJskwoeih - Kalapwowkeloekeej
        </span>

        <button
            class="copy-icon"
            onclick="copyKey()"
            aria-label="Copy key"
        >
            ⧉
        </button>

    </div>


    <!-- COPY BUTTON -->
    <button
        id="copyButton"
        class="copy-btn"
        onclick="copyKey()"
    >
        COPY KEY
    </button>


    <!-- MESSAGE -->
    <div id="message"></div>


    <div class="footer">
        © 2026 CLOUTHUB • KEY SYSTEM
    </div>

</div>


<script>

/* ==============================
   KEY
============================== */

const KEY =
"CloutHubKeyJskwoeih - Kalapwowkeloekeej";


/* ==============================
   COPY KEY
============================== */

async function copyKey(){

    const button =
        document.getElementById("copyButton");

    const message =
        document.getElementById("message");

    try{

        await navigator.clipboard.writeText(KEY);

        button.textContent =
            "✓ KEY COPIED";

        message.className =
            "success";

        message.textContent =
            "Key copied successfully!";

        /* Button effect */

        button.animate(
            [
                {transform:"scale(1)"},
                {transform:"scale(.96)"},
                {transform:"scale(1.03)"},
                {transform:"scale(1)"}
            ],
            {
                duration:400
            }
        );

        setTimeout(() => {

            button.textContent =
                "COPY KEY";

            message.textContent = "";

        },2500);

    }catch(error){

        /* Fallback cho trình duyệt không hỗ trợ Clipboard API */

        const temp =
            document.createElement("textarea");

        temp.value = KEY;

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        temp.remove();

        button.textContent =
            "✓ KEY COPIED";

        message.className =
            "success";

        message.textContent =
            "Key copied successfully!";

        setTimeout(() => {

            button.textContent =
                "COPY KEY";

            message.textContent = "";

        },2500);
    }
}

</script>

</body>
</html>
